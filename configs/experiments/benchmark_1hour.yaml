experiment:
  name: "production_docker_1hr_benchmark"
  seed: 1337
  duration_seconds: 3600
  sampling_interval_seconds: 1.0

containers:
  concurrent_instances: 2
  base_image: "neuroscale-workload:latest"
  network_name: "neuroscale_bench_net"
  resource_constraints:
    cpus: 2.0
    memory_mb: 1024

workload_randomization:
  enabled: true
  min_phase_duration_seconds: 30
  max_phase_duration_seconds: 60
  profile_weights:
    idle: 0.15
    cpu_intensive: 0.25
    memory_intensive: 0.20
    disk_io_intensive: 0.15
    network_intensive: 0.10
    mixed: 0.15
  intensity_ranges:
    cpu_utilization_target: [20, 100]
    memory_allocation_mb: [128, 896]
    io_block_size_kb: [4, 1024]
    network_packet_rate_mbps: [5, 100]

export:
  export_csv: true
  export_jsonl: true
  sync_to_data_raw_metrics: true
  datasets_dir: "datasets"
